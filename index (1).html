<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zyklustagebuch</title>
<meta name="theme-color" content="#241B33">
<meta name="description" content="Zyklus, Symptome und Prognosen. Alle Daten bleiben auf diesem Gerät.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:"Bricolage Grotesque";font-weight:500;font-display:swap;src:url(fonts/bricolage-grotesque-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-weight:700;font-display:swap;src:url(fonts/bricolage-grotesque-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:400;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:700;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-size:16px}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: one narrow app column; bottom tab bar; each view is a stack of plain sections, cards only where an object stands alone */
:root{
  --bg:#F4F3F8; --surface:#FFFFFF; --fg:#211F2A; --muted:#696577; --line:#E2DFEA;
  --period:#A3214A; --period-soft:#F5DCE4;
  --fertile:#1F7F77; --fertile-soft:#D5EEEB;
  --follikel:#5A6CB0; --luteal:#B07A1E;
  --warn:#9A5A00; --warn-soft:#FBEBD2;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16141C; --surface:#211E2A; --fg:#ECE9F3; --muted:#A39FB2; --line:#34303F;
  --period:#E5638A; --period-soft:#4A2132; --fertile:#4CC3B7; --fertile-soft:#173B38;
  --follikel:#8E9EE0; --luteal:#E0AA4C; --warn:#F0B35A; --warn-soft:#3D2C12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16141C; --surface:#211E2A; --fg:#ECE9F3; --muted:#A39FB2; --line:#34303F;
  --period:#E5638A; --period-soft:#4A2132; --fertile:#4CC3B7; --fertile-soft:#173B38;
  --follikel:#8E9EE0; --luteal:#E0AA4C; --warn:#F0B35A; --warn-soft:#3D2C12; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
main{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.75rem} h2{font-size:1.25rem} h3{font-size:1rem}
p{margin:0}
.muted{color:var(--muted)}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.stack{display:flex;flex-direction:column;gap:20px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.num{font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--follikel);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:700}
.btn.primary{background:var(--period);border-color:var(--period);color:#fff}
.btn.danger{color:var(--period)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.banner{background:var(--warn-soft);color:var(--fg);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner b{color:var(--warn)}
header.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}

/* Home ring */
.ring-wrap{display:grid;place-items:center;position:relative}
.ring-wrap svg{width:min(300px,80vw);height:auto;display:block}
.ring-center{position:absolute;text-align:center}
.ring-center .day{font-family:var(--display);font-size:3rem;line-height:1;font-weight:700}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.facts>div{background:var(--surface);padding:12px 14px;min-width:0}
.facts .v{font-family:var(--display);font-size:1.15rem;font-weight:700}
.phase-pill{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.9rem}
.phase-pill i{width:10px;height:10px;border-radius:50%;display:inline-block}

/* Calendar */
.cal-head{display:flex;justify-content:space-between;align-items:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:.75rem;color:var(--muted);font-weight:700;padding-bottom:4px}
.cell{aspect-ratio:1;max-width:100%;border:1px solid transparent;border-radius:50%;background:transparent;display:grid;place-items:center;position:relative;font-variant-numeric:tabular-nums;font-size:.95rem;padding:0}
.cell.out{opacity:.35}
.cell.fertile{background:var(--fertile-soft)}
.cell.pred{border:2px dashed var(--period);color:var(--period)}
.cell.rec{background:var(--period);color:#fff;font-weight:700}
.cell.today{box-shadow:0 0 0 2px var(--fg)}
.cell .ov{position:absolute;bottom:12%;width:6px;height:6px;border-radius:50%;background:var(--fertile)}
.cell .ent{position:absolute;top:10%;right:14%;width:5px;height:5px;border-radius:50%;background:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.85rem;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.sw{width:14px;height:14px;border-radius:50%;display:inline-block}

/* Tracking */
.date-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.1rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:700}
.flow .chip[aria-pressed="true"]{background:var(--period);border-color:var(--period);color:#fff}
textarea,input[type=number],input[type=text]{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
textarea{min-height:84px;resize:vertical}
.saved{font-size:.85rem;color:var(--fertile);min-height:1.2em}

/* Analysis */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpis>div{min-width:0}
.kpis .v{font-family:var(--display);font-size:1.6rem;font-weight:700}
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:72px 1fr 44px;gap:10px;align-items:center;font-size:.88rem}
.track{height:14px;background:var(--line);border-radius:7px;position:relative;overflow:hidden}
.track .fill{position:absolute;inset:0 auto 0 0;background:var(--follikel);border-radius:7px;opacity:.55}
.track .per{position:absolute;inset:0 auto 0 0;background:var(--period);border-radius:7px 0 0 7px}
.track .ref{position:absolute;top:-2px;bottom:-2px;width:0;border-left:1.5px dashed var(--muted)}
.freq .track .fill{opacity:1;background:var(--period)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tbl{overflow-x:auto}

/* Knowledge */
details{border-bottom:1px solid var(--line);padding:12px 0}
details summary{font-weight:700;cursor:pointer;font-family:var(--display);font-size:1.05rem}
details p,details ul{margin-top:8px;max-width:65ch}
details ul{padding-left:20px}
a{color:var(--follikel)}

/* Tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:560px}
nav.tabs button{background:none;border:0;padding:10px 2px 12px;font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--period);font-weight:700}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .18s ease-out}@keyframes fade{from{opacity:.4}to{opacity:1}}}
</style>
</head>
<body>

<main id="app"></main>
<nav class="tabs" aria-label="Bereiche"><div class="in" id="tabs"></div></nav>

<script>
const KEY='zyklustagebuch-v1';
const APP_VERSION='1.1';
const APP_DATE='2026-11-09';
const CATS=[
 {id:'schmerzen',label:'Schmerzen',multi:true,opts:['Krämpfe','Kopfschmerzen','Rückenschmerzen']},
 {id:'koerper',label:'Körper',multi:true,opts:['Blähungen','Brustspannen','Akne']},
 {id:'stimmung',label:'Stimmung',multi:true,opts:['Glücklich','Traurig','Gereizt','Ängstlich']},
 {id:'energie',label:'Energie',multi:false,opts:['Niedrig','Mittel','Hoch']},
 {id:'verdauung',label:'Verdauung',multi:true,opts:['Durchfall','Verstopfung','Übelkeit']},
 {id:'schlaf',label:'Schlaf',multi:false,opts:['Gut','Schlecht','Unruhig']},
 {id:'ausfluss',label:'Ausfluss',multi:false,opts:['Trocken','Cremig','Wässrig','Spinnbar']},
 {id:'libido',label:'Libido',multi:false,opts:['Niedrig','Normal','Hoch']},
];
const FLOWS=[['','Keine'],['leicht','Leicht'],['mittel','Mittel'],['stark','Stark']];
const PHASES={menstruation:['Menstruationsphase','--period'],follikel:['Follikelphase','--follikel'],ovulation:['Ovulationsphase','--fertile'],luteal:['Lutealphase','--luteal']};

/* ---------- dates (all as YYYY-MM-DD, computed in UTC) ---------- */
const pad=n=>String(n).padStart(2,'0');
const todayKey=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const P=k=>Date.UTC(+k.slice(0,4),+k.slice(5,7)-1,+k.slice(8,10));
const add=(k,n)=>new Date(P(k)+n*864e5).toISOString().slice(0,10);
const diff=(a,b)=>Math.round((P(b)-P(a))/864e5);
const fmt=(k,o={day:'numeric',month:'short'})=>new Intl.DateTimeFormat('de-DE',{...o,timeZone:'UTC'}).format(new Date(P(k)));
const avg=a=>a.reduce((s,x)=>s+x,0)/a.length;

/* ---------- storage ---------- */
function demo(){
  const t=todayKey(), days={};
  const starts=[-98,-69,-42,-12].map(n=>add(t,n));
  const flows=['mittel','stark','stark','mittel','leicht'];
  starts.forEach((s,ci)=>{
    if(ci>0){
      days[add(s,-3)]={tags:{koerper:['Brustspannen','Blähungen'],stimmung:['Gereizt']}};
      days[add(s,-14)]={tags:{ausfluss:['Spinnbar'],libido:['Hoch'],energie:['Hoch'],stimmung:['Glücklich']}};
    }
    const len=ci===1?4:5;
    for(let i=0;i<len;i++) days[add(s,i)]={flow:flows[i],tags:{}};
    days[s].tags={schmerzen:['Krämpfe'],stimmung:['Gereizt'],energie:['Niedrig']};
    days[add(s,1)].tags={schmerzen:['Krämpfe','Rückenschmerzen'],schlaf:['Unruhig'],stimmung:['Traurig']};
  });
  days[add(t,-1)]={tags:{ausfluss:['Cremig'],energie:['Hoch'],stimmung:['Glücklich']}};
  return {settings:{cycleLen:28,periodLen:5,theme:'system',custom:[]},days,demo:true};
}
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.days||!S.settings) S=demo();
S.settings.custom=S.settings.custom||[];
let storageOk=true;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){storageOk=false}}
function applyTheme(){const t=S.settings.theme;if(t==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t)}

/* ---------- cycle model ---------- */
function stats(){
  const flowDays=Object.keys(S.days).filter(k=>S.days[k].flow).sort();
  const runs=[];
  for(const k of flowDays){
    const r=runs[runs.length-1];
    if(r&&diff(r.end,k)<=2){r.end=k}else runs.push({start:k,end:k});
  }
  runs.forEach(r=>r.len=diff(r.start,r.end)+1);
  const cycles=[];
  for(let i=0;i<runs.length-1;i++) cycles.push({start:runs[i].start,len:diff(runs[i].start,runs[i+1].start),period:runs[i].len});
  const recent=cycles.slice(-6);
  const avgCycle=recent.length?Math.round(avg(recent.map(c=>c.len))):+S.settings.cycleLen;
  const avgPeriod=runs.length?Math.round(avg(runs.slice(-6).map(r=>r.len))):+S.settings.periodLen;
  const last=runs[runs.length-1]||null;
  const nextStart=last?add(last.start,avgCycle):null;
  return {runs,cycles,avgCycle,avgPeriod,last,nextStart};
}
function ovDayFor(len,per){return Math.max(per+2,len-14)} // Lutealphase ≈ 14 Tage
function phaseOf(cd,len,per){
  const ov=ovDayFor(len,per);
  if(cd<=per) return 'menstruation';
  if(Math.abs(cd-ov)<=1) return 'ovulation';
  return cd<ov?'follikel':'luteal';
}
// info for any date: cycle day, phase, fertile, ovulation, predicted period
function dayInfo(k,st){
  if(!st.last) return null;
  const today=todayKey();
  let start,len,per,predicted=false;
  if(k>=st.last.start){
    // after the last recorded start: project average cycles forward
    const overdue=st.nextStart<=today;
    if(k<=today||!overdue){
      // project average cycles forward; while overdue, everything up to today stays in the current cycle
      const n=overdue?0:Math.floor(diff(st.last.start,k)/st.avgCycle);
      start=add(st.last.start,n*st.avgCycle); predicted=n>0;
    }else{
      // overdue: assume the period starts tomorrow and project from there
      const base=add(today,1),n=Math.floor(diff(base,k)/st.avgCycle);
      start=add(base,n*st.avgCycle); predicted=true;
    }
    len=st.avgCycle; per=predicted?st.avgPeriod:st.last.len;
  }else{
    const i=st.runs.findLastIndex(r=>r.start<=k);
    if(i<0) return null;
    start=st.runs[i].start; per=st.runs[i].len;
    len=st.runs[i+1]?diff(start,st.runs[i+1].start):st.avgCycle;
  }
  const cd=diff(start,k)+1;
  const ov=ovDayFor(len,per);
  return {cd,len,per,phase:cd>len?'luteal':phaseOf(cd,len,per),fertile:cd>=ov-5&&cd<=ov+1,ov:cd===ov,predPeriod:predicted&&cd<=per&&!(S.days[k]&&S.days[k].flow)};
}
function flags(st){
  const out=[];const today=todayKey();
  st.cycles.slice(-6).forEach(c=>{if(c.len<21||c.len>35) out.push(`Zyklus ab ${fmt(c.start)} war ${c.len} Tage lang (üblich: 21–35).`)});
  st.runs.slice(-6).forEach(r=>{if(r.len>7) out.push(`Periode ab ${fmt(r.start)} dauerte ${r.len} Tage (mehr als 7).`)});
  if(st.nextStart){const late=diff(st.nextStart,today);if(late>=7) out.push(`Periode bleibt aus: ${late} Tage über der Prognose.`)}
  return out;
}

/* ---------- view state ---------- */
let view='home', calMonth=todayKey().slice(0,7), trackDate=todayKey(), confirmDelete=false, ioMsg='';
const TABS=[
 ['home','Heute','<circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="4" r="2.4" fill="currentColor"/>'],
 ['kalender','Kalender','<rect x="4" y="5" width="16" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 10h16M9 3v4M15 3v4" stroke="currentColor" stroke-width="2"/>'],
 ['eintragen','Eintragen','<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="2"/>'],
 ['analyse','Analyse','<path d="M5 19V11M12 19V5M19 19v-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>'],
 ['mehr','Mehr','<circle cx="6" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="18" cy="12" r="1.8" fill="currentColor"/>'],
];
function go(v){view=v;render();window.scrollTo(0,0)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pill=ph=>`<span class="phase-pill"><i style="background:var(${PHASES[ph][1]})"></i>${PHASES[ph][0]}</span>`;

function demoBanner(){
  if(!S.demo) return '';
  return `<div class="banner"><span><b>Beispieldaten.</b> So sieht die App mit ein paar Monaten Einträgen aus.</span><button class="btn" data-act="clear-demo">Leeren und selbst starten</button></div>`;
}

/* ---------- Home ---------- */
function ring(st,cd){
  const L=st.avgCycle,R=88,C=2*Math.PI*R,seg=C/L,gap=Math.min(2,seg*.25);
  let s='';
  for(let i=0;i<L;i++){
    const ph=phaseOf(i+1,L,st.avgPeriod);
    s+=`<circle cx="110" cy="110" r="${R}" fill="none" stroke="var(${PHASES[ph][1]})" stroke-opacity="${i+1<=cd?1:.32}" stroke-width="18" stroke-dasharray="${(seg-gap).toFixed(2)} ${(C-seg+gap).toFixed(2)}" stroke-dashoffset="${(-i*seg).toFixed(2)}"/>`;
  }
  const a=((Math.min(cd,L)-.5)/L)*2*Math.PI;
  const x=110+R*Math.cos(a),y=110+R*Math.sin(a);
  return `<svg viewBox="0 0 220 220" role="img" aria-label="Zyklusring, Tag ${cd} von ${L}"><g transform="rotate(-90 110 110)">${s}<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="12" fill="var(--surface)" stroke="var(--fg)" stroke-width="3"/></g></svg>`;
}
function vHome(){
  const st=stats(),t=todayKey();
  if(!st.last) return `<div class="stack">${demoBanner()}<h1>Willkommen</h1><p>Trag den ersten Tag der letzten Periode ein. Danach berechnet die App Zyklustag, Phase und Prognosen.</p><button class="btn primary" data-go="eintragen">Ersten Periodentag eintragen</button></div>`;
  const cd=diff(st.last.start,t)+1;
  const info=dayInfo(t,st);
  const late=st.nextStart&&t>=st.nextStart;
  const ovDate=add(st.last.start,ovDayFor(st.avgCycle,st.last.len)-1);
  let nextOv=ovDate>=t?ovDate:add(ovDate,st.avgCycle);
  const fw=[add(nextOv,-5),add(nextOv,1)];
  const daysTo=st.nextStart?diff(t,st.nextStart):null;
  const e=S.days[t];
  const todayTags=e?Object.values(e.tags||{}).flat():[];
  const fl=flags(st);
  return `<div class="stack">
  ${demoBanner()}
  <header class="top"><div class="row" style="flex-wrap:nowrap"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="40" height="40" style="border-radius:11px;flex:none" aria-hidden="true"> <rect width="40" height="40" style="border-radius:11px;flex:none" aria-hidden="true" fill="#241B33"/> <path d="M533.9 285.0 A228 228 0 0 1 707.0 393.8" fill="none" stroke="#E5638A" stroke-width="96"/> <path d="M726.0 433.2 A228 228 0 0 1 583.8 728.4" fill="none" stroke="#8E9EE0" stroke-width="96"/> <path d="M541.2 738.1 A228 228 0 0 1 433.2 726.0" fill="none" stroke="#4CC3B7" stroke-width="96"/> <path d="M393.8 707.0 A228 228 0 0 1 490.1 285.0" fill="none" stroke="#E0AA4C" stroke-width="96"/> <circle cx="587.3" cy="727.2" r="58" fill="#FFFFFF" stroke="#241B33" stroke-width="22"/> <circle cx="512" cy="512" r="58" fill="#E5638A"/> </svg><h1>Heute</h1></div><span class="muted">${fmt(t,{weekday:'long',day:'numeric',month:'long'})}</span></header>
  <div class="ring-wrap">${ring(st,cd)}<div class="ring-center"><div class="label">Zyklustag</div><div class="day num">${cd}</div><div style="margin-top:6px">${late?'<b style="color:var(--period)">Periode erwartet</b>':pill(info.phase)}</div></div></div>
  ${fl.length?`<div class="banner"><span>${fl.map(esc).join('<br>')}</span><button class="btn" data-go="mehr" data-open="arzt">Wann zum Arzt?</button></div>`:''}
  <div class="facts">
    <div><div class="label">Nächste Periode</div><div class="v num">${late?(daysTo===0?'heute fällig':`${-daysTo} Tg. überfällig`):`in ${daysTo} Tg.`}</div><div class="muted">${fmt(st.nextStart,{weekday:'short',day:'numeric',month:'short'})}</div></div>
    <div><div class="label">Eisprung (geschätzt)</div><div class="v">${fmt(nextOv,{day:'numeric',month:'short'})}</div><div class="muted">${diff(t,nextOv)===0?'heute':'in '+diff(t,nextOv)+' Tg.'}</div></div>
    <div><div class="label">Fruchtbares Fenster</div><div class="v">${fmt(fw[0])} – ${fmt(fw[1])}</div><div class="muted">${info.fertile?'jetzt':'Schätzung'}</div></div>
    <div><div class="label">Heutiges Befinden</div><div class="v" style="font-size:1rem">${todayTags.length?esc(todayTags.slice(0,4).join(', ')):'noch nichts eingetragen'}</div></div>
  </div>
  <div class="row"><button class="btn primary" data-act="track-today">Heute eintragen</button>${!e?.flow?'<button class="btn" data-act="period-today">Periode hat heute begonnen</button>':''}</div>
  <p class="muted" style="font-size:.85rem">Eisprung und fruchtbare Tage sind Schätzungen aus dem Kalender. Sie sind keine sichere Verhütungsmethode.</p>
  </div>`;
}

/* ---------- Calendar ---------- */
function vKalender(){
  const st=stats(),t=todayKey();
  const first=calMonth+'-01';
  const dow=(new Date(P(first)).getUTCDay()+6)%7;
  const start=add(first,-dow);
  let cells='';
  for(let i=0;i<42;i++){
    const k=add(start,i);
    if(i>=35&&k.slice(0,7)!==calMonth) break;
    const inf=dayInfo(k,st);const e=S.days[k];
    const cls=['cell'];
    if(k.slice(0,7)!==calMonth) cls.push('out');
    if(e?.flow) cls.push('rec'); else if(inf?.predPeriod) cls.push('pred'); else if(inf?.fertile) cls.push('fertile');
    if(k===t) cls.push('today');
    const hasTags=e&&(Object.values(e.tags||{}).flat().length||e.note);
    cells+=`<button class="${cls.join(' ')}" data-day="${k}" aria-label="${fmt(k,{day:'numeric',month:'long'})}">${+k.slice(8)}${inf?.ov&&!e?.flow?'<span class="ov"></span>':''}${hasTags?'<span class="ent"></span>':''}</button>`;
  }
  const title=new Intl.DateTimeFormat('de-DE',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(P(first)));
  return `<div class="stack">
  <div class="cal-head"><button class="icon-btn" data-cal="-1" aria-label="Vorheriger Monat">‹</button><h1 style="font-size:1.4rem">${title}</h1><button class="icon-btn" data-cal="1" aria-label="Nächster Monat">›</button></div>
  <div class="cal">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(d=>`<div class="wd">${d}</div>`).join('')}${cells}</div>
  <div class="legend">
   <span><i class="sw" style="background:var(--period)"></i>Periode</span>
   <span><i class="sw" style="border:2px dashed var(--period)"></i>Prognose</span>
   <span><i class="sw" style="background:var(--fertile-soft)"></i>Fruchtbar</span>
   <span><i class="sw" style="background:var(--fertile);width:8px;height:8px"></i>Eisprung</span>
   <span><i class="sw" style="background:var(--muted);width:6px;height:6px"></i>Einträge</span>
  </div>
  <p class="muted" style="font-size:.9rem">Tippe auf einen Tag, um ihn einzutragen.</p>
  ${st.last?`<div class="stack-s"><div class="label">Zyklusphasen bei ${st.avgCycle} Tagen</div><div class="row" style="gap:6px 16px">${Object.keys(PHASES).map(pill).join('')}</div></div>`:''}
  </div>`;
}

/* ---------- Tracking ---------- */
function vEintragen(){
  const k=trackDate,e=S.days[k]||{tags:{}},st=stats(),inf=dayInfo(k,st);
  const isFuture=k>todayKey();
  const flow=FLOWS.map(([v,l])=>`<button class="chip" data-flow="${v}" aria-pressed="${(e.flow||'')===v}">${l}</button>`).join('');
  const cats=[...CATS];
  if(S.settings.custom.length) cats.push({id:'eigene',label:'Eigene Symptome',multi:true,opts:S.settings.custom});
  const groups=cats.map(c=>`<div class="stack-s"><div class="label">${c.label}</div><div class="chips">${c.opts.map(o=>`<button class="chip" data-cat="${c.id}" data-opt="${esc(o)}" aria-pressed="${(e.tags?.[c.id]||[]).includes(o)}">${esc(o)}</button>`).join('')}</div></div>`).join('');
  return `<div class="stack">
  <div class="date-nav"><button class="icon-btn" data-td="-1" aria-label="Vorheriger Tag">‹</button>
   <div style="text-align:center"><h1 style="font-size:1.35rem">${k===todayKey()?'Heute':fmt(k,{weekday:'long'})}</h1><div class="muted">${inf?`Zyklustag ${inf.cd}`:''}</div><input type="date" id="pickdate" aria-label="Datum wählen" value="${k}" max="${todayKey()}" style="margin-top:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px"></div>
   <button class="icon-btn" data-td="1" aria-label="Nächster Tag" ${isFuture?'disabled':''}>›</button></div>
  ${isFuture?'<p class="muted">Dieser Tag liegt in der Zukunft.</p>':''}
  <p class="muted" style="font-size:.9rem">Tippe an, was an diesem Tag zutrifft. Alles wird sofort gespeichert. Kein Eintrag nötig, wenn nichts zutrifft.</p>
  <div class="stack-s"><div class="label">Blutung an diesem Tag</div><div class="chips flow">${flow}</div></div>
  ${groups}
  <div class="stack-s"><label class="label" for="note">Notiz</label><textarea id="note" placeholder="Was war heute anders?">${esc(e.note||'')}</textarea></div>
  <div class="row"><button class="btn primary" data-act="done">Speichern und fertig</button><span class="saved" id="saved"></span></div>
  </div>`;
}
function entry(k){if(!S.days[k])S.days[k]={tags:{}};S.days[k].tags=S.days[k].tags||{};return S.days[k]}
function tidy(k){const e=S.days[k];if(!e)return;const any=e.flow||(e.note&&e.note.trim())||Object.values(e.tags||{}).some(a=>a.length);if(!any)delete S.days[k]}
function flash(){const el=document.getElementById('saved');if(el){el.textContent=storageOk?'Gespeichert':'Konnte nicht gespeichert werden: Der Browser blockiert den Speicher.';clearTimeout(flash.t);flash.t=setTimeout(()=>{if(el)el.textContent=''},1500)}}

/* ---------- Analysis ---------- */
function vAnalyse(){
  const st=stats();
  if(st.cycles.length<1) return `<div class="stack"><h1>Analyse</h1><p>Sobald zwei Periodenstarts eingetragen sind, erscheinen hier Zykluslängen und Muster.</p></div>`;
  const cyc=st.cycles.slice(-8);
  const max=Math.max(40,...cyc.map(c=>c.len));
  const bars=cyc.map(c=>`<div class="bar-row"><span class="muted num">${fmt(c.start)}</span><div class="track" title="${c.len} Tage"><div class="fill" style="width:${c.len/max*100}%"></div><div class="per" style="width:${c.period/max*100}%"></div><div class="ref" style="left:${21/max*100}%"></div><div class="ref" style="left:${35/max*100}%"></div></div><span class="num"><b>${c.len}</b> Tg.</span></div>`).join('');
  const lens=st.cycles.map(c=>c.len);
  // symptom frequency
  const cnt={};let tracked=0;
  for(const [k,e] of Object.entries(S.days)){const tags=Object.entries(e.tags||{}).filter(([c])=>!['energie','schlaf','ausfluss','libido'].includes(c)).flatMap(([,v])=>v);if(tags.length)tracked++;tags.forEach(t=>cnt[t]=(cnt[t]||0)+1)}
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const fmax=top.length?top[0][1]:1;
  const freq=top.map(([t,n])=>`<div class="bar-row"><span>${esc(t)}</span><div class="track"><div class="fill" style="width:${n/fmax*100}%"></div></div><span class="num">${n}×</span></div>`).join('');
  // mood by phase
  const mp={};
  for(const [k,e] of Object.entries(S.days)){const m=e.tags?.stimmung;if(!m?.length)continue;const inf=dayInfo(k,st);if(!inf)continue;(mp[inf.phase]=mp[inf.phase]||{});m.forEach(x=>mp[inf.phase][x]=(mp[inf.phase][x]||0)+1)}
  const moodRows=Object.keys(PHASES).map(ph=>{const o=mp[ph];const s=o?Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([m,n])=>`${m} (${n})`).join(', '):'<span class="muted">keine Einträge</span>';return `<tr><td>${pill(ph)}</td><td>${s}</td></tr>`}).join('');
  // flow per period
  const flowRows=st.runs.slice(-6).map(r=>{const seq=[];for(let k=r.start;k<=r.end;k=add(k,1)){const f=S.days[k]?.flow;seq.push(f?f[0].toUpperCase():'·')}return `<tr><td class="num">${fmt(r.start)}</td><td class="num">${r.len} Tg.</td><td class="num" style="letter-spacing:.2em">${seq.join('')}</td></tr>`}).join('');
  return `<div class="stack">
  <h1>Analyse</h1>
  <div class="kpis"><div><div class="label">Ø Zyklus</div><div class="v num">${st.avgCycle}</div><div class="muted">Tage</div></div><div><div class="label">Ø Periode</div><div class="v num">${st.avgPeriod}</div><div class="muted">Tage</div></div><div><div class="label">Spanne</div><div class="v num">${Math.min(...lens)}–${Math.max(...lens)}</div><div class="muted">${lens.length} Zyklen</div></div></div>
  <section class="stack-s"><h2>Zykluslängen</h2><p class="muted" style="font-size:.88rem">Rot: Periode. Gestrichelt: 21 und 35 Tage, der übliche Bereich.</p><div class="bars">${bars}</div></section>
  <section class="stack-s"><h2>Häufigste Beschwerden</h2>${top.length?`<div class="bars freq">${freq}</div><p class="muted" style="font-size:.85rem">Aus ${tracked} Tagen mit Einträgen.</p>`:'<p class="muted">Noch keine Symptome eingetragen.</p>'}</section>
  <section class="stack-s"><h2>Stimmung nach Phase</h2><div class="tbl"><table><tbody>${moodRows}</tbody></table></div></section>
  <section class="stack-s"><h2>Blutungsstärke je Periode</h2><div class="tbl"><table><thead><tr><th>Beginn</th><th>Dauer</th><th>Verlauf (L/M/S)</th></tr></thead><tbody>${flowRows}</tbody></table></div></section>
  </div>`;
}

/* ---------- More: knowledge + settings ---------- */
let openSection='';
function vMehr(){
  const s=S.settings;
  const k=(id,title,body)=>`<details id="d-${id}" ${openSection===id?'open':''}><summary>${title}</summary>${body}</details>`;
  return `<div class="stack">
  <h1>Wissen</h1>
  <div>
  ${k('phasen','Die vier Zyklusphasen',`<ul><li><b>Menstruation</b> (Tag 1 bis Ende der Blutung): Die Gebärmutterschleimhaut wird abgestoßen. Östrogen und Progesteron sind niedrig.</li><li><b>Follikelphase</b>: Östrogen steigt, ein Follikel reift heran. Viele erleben hier mehr Energie.</li><li><b>Ovulation</b>: Ein LH-Anstieg löst den Eisprung aus. Der Zervixschleim wird klar und spinnbar.</li><li><b>Lutealphase</b> (etwa 14 Tage): Progesteron dominiert. Ohne Befruchtung fallen die Hormone ab und die nächste Periode beginnt.</li></ul>`)}
  ${k('pms','PMS',`<p>Prämenstruelles Syndrom: körperliche und seelische Beschwerden in den Tagen vor der Periode, etwa Brustspannen, Blähungen, Reizbarkeit oder Niedergeschlagenheit. Sie klingen mit Beginn der Blutung ab. Das Symptom-Tracking zeigt, ob die Beschwerden wirklich an die Lutealphase gebunden sind.</p>`)}
  ${k('tipps','Hilfe bei Beschwerden',`<ul><li>Wärme auf Bauch oder Rücken</li><li>Leichte Bewegung, zum Beispiel Spazierengehen oder Dehnen</li><li>Schmerzmittel wie Ibuprofen nach Packungsbeilage, wenn verträglich</li><li>Ausreichend Schlaf und regelmäßige Mahlzeiten</li></ul>`)}
  ${k('pcos','PCOS und Endometriose',`<p><b>PCOS</b> (polyzystisches Ovarialsyndrom) zeigt sich oft durch unregelmäßige oder ausbleibende Perioden, vermehrte Körperbehaarung, Akne oder Gewichtszunahme. <b>Endometriose</b> verursacht häufig starke Regelschmerzen, Schmerzen beim Sex oder Stuhlgang. Beides kann nur ärztlich festgestellt werden.</p>`)}
  ${k('arzt','Wann ärztlichen Rat suchen?',`<p>Laut NHS lohnt sich ein Termin, wenn:</p><ul><li>die Abstände zwischen den Perioden unter 21 oder über 35 Tagen liegen,</li><li>eine Periode länger als 7 Tage dauert,</li><li>zwischen den Perioden Blutungen auftreten,</li><li>unregelmäßige Perioden mit Gewichtszunahme, Müdigkeit, Haarwuchs im Gesicht oder auffälliger Haut zusammenfallen,</li><li>sich das gewohnte Muster verändert.</li></ul><p>Bleibt die Periode aus, kann ein Schwangerschaftstest Klarheit geben. Quelle: <a href="https://www.nhs.uk/conditions/irregular-periods/" target="_blank" rel="noopener">NHS, Irregular periods</a></p>`)}
  </div>

  <h1>Einstellungen</h1>
  <div class="stack-s"><p class="muted" style="font-size:.9rem">Diese Werte gelten, bis mindestens zwei Periodenstarts eingetragen sind. Danach rechnet die App mit dem Durchschnitt der letzten sechs Zyklen.</p>
   <div class="row" style="flex-wrap:nowrap"><div style="flex:1;min-width:0"><label class="label" for="cl">Zykluslänge (Tage)</label><input id="cl" type="number" min="15" max="60" value="${s.cycleLen}"></div><div style="flex:1;min-width:0"><label class="label" for="pl">Periodendauer (Tage)</label><input id="pl" type="number" min="1" max="12" value="${s.periodLen}"></div></div>
  </div>
  <div class="stack-s"><label class="label" for="cu">Eigene Symptome (mit Komma getrennt)</label><input id="cu" type="text" value="${esc(s.custom.join(', '))}" placeholder="z. B. Migräne, Heißhunger"></div>
  <div class="stack-s"><div class="label">Darstellung</div><div class="chips">${[['system','Wie Gerät'],['light','Hell'],['dark','Dunkel']].map(([v,l])=>`<button class="chip" data-theme-set="${v}" aria-pressed="${s.theme===v}">${l}</button>`).join('')}</div></div>

  <h2>Daten</h2>
  <p class="muted" style="font-size:.9rem">Alle Einträge bleiben nur in diesem Browser auf diesem Gerät. Nichts wird an einen Server geschickt. Wer den Browser-Speicher löscht, verliert die Daten, deshalb regelmäßig sichern.</p>
  <div class="stack-s"><label class="label" for="io">Sicherung</label><textarea id="io" placeholder="Hier erscheint die Sicherung, oder füge eine Sicherung zum Wiederherstellen ein." style="min-height:110px;font-size:.8rem"></textarea>
   <div class="row"><button class="btn" data-act="export">Sicherung erzeugen und kopieren</button><button class="btn" data-act="import">Aus Feld wiederherstellen</button></div>
   <div class="saved" style="color:var(--fg)">${esc(ioMsg)}</div></div>
  <div class="stack-s">${confirmDelete?`<div class="banner"><span>Alle Einträge endgültig löschen?</span><div class="row"><button class="btn" data-act="cancel-del">Abbrechen</button><button class="btn primary" data-act="do-del">Ja, alles löschen</button></div></div>`:`<button class="btn danger" data-act="ask-del" style="align-self:flex-start">Alle Daten löschen</button>`}</div>
  <p class="muted num" style="font-size:.85rem;border-top:1px solid var(--line);padding-top:12px">Zyklustagebuch · Version ${APP_VERSION} · ${fmt(APP_DATE,{day:'numeric',month:'long',year:'numeric'})}</p>
  </div>`;
}

/* ---------- render + events ---------- */
function render(){
  applyTheme();
  const v={home:vHome,kalender:vKalender,eintragen:vEintragen,analyse:vAnalyse,mehr:vMehr}[view]();
  document.getElementById('app').innerHTML=`<div class="view">${v}</div>`;
  document.getElementById('tabs').innerHTML=TABS.map(([id,l,ic])=>`<button data-go="${id}" ${view===id?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${ic}</svg>${l}</button>`).join('');
  if(view==='mehr'&&openSection){const d=document.getElementById('d-'+openSection);if(d)d.scrollIntoView({block:'start'});openSection=''}
}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('button');if(!b)return;
  const d=b.dataset;
  if(d.go){if(d.open)openSection=d.open;go(d.go);return}
  if(d.cal){const [y,m]=calMonth.split('-').map(Number);const dt=new Date(Date.UTC(y,m-1+ +d.cal,1));calMonth=dt.toISOString().slice(0,7);render();return}
  if(d.day){if(d.day<=todayKey()){trackDate=d.day;go('eintragen')}return}
  if(d.td){const n=add(trackDate,+d.td);if(n<=todayKey()){trackDate=n;render()}return}
  if(d.flow!==undefined){const e=entry(trackDate);e.flow=d.flow||undefined;if(!e.flow)delete e.flow;tidy(trackDate);S.demo=false;save();render();flash();return}
  if(d.cat){const e=entry(trackDate);const c=CATS.find(x=>x.id===d.cat)||{multi:true};let a=e.tags[d.cat]||[];
    if(a.includes(d.opt))a=a.filter(x=>x!==d.opt);else a=c.multi?[...a,d.opt]:[d.opt];
    if(a.length)e.tags[d.cat]=a;else delete e.tags[d.cat];tidy(trackDate);save();render();flash();return}
  if(d.themeSet){S.settings.theme=d.themeSet;save();render();return}
  const act=d.act;
  if(act==='done'){save();go('home')}
  else if(act==='track-today'){trackDate=todayKey();go('eintragen')}
  else if(act==='period-today'){const e=entry(todayKey());e.flow='mittel';save();trackDate=todayKey();go('eintragen')}
  else if(act==='clear-demo'){S={settings:{...S.settings},days:{},demo:false};save();render()}
  else if(act==='export'){const txt=JSON.stringify({app:'zyklustagebuch',v:1,...S});const io=document.getElementById('io');io.value=txt;
    const done=m=>{ioMsg=m;const keep=io.value;render();document.getElementById('io').value=keep};
    try{navigator.clipboard.writeText(txt).then(()=>done('Sicherung kopiert. Füge sie z. B. in eine Notiz oder E-Mail an dich selbst ein.'),()=>{io.select();done('Kopieren nicht möglich. Text im Feld markieren und manuell kopieren.')})}catch(e){io.select();done('Kopieren nicht möglich. Text im Feld markieren und manuell kopieren.')}}
  else if(act==='import'){try{const o=JSON.parse(document.getElementById('io').value);if(!o.days||!o.settings)throw 0;S={settings:{cycleLen:28,periodLen:5,theme:'system',custom:[],...o.settings},days:o.days,demo:false};save();ioMsg=`Wiederhergestellt: ${Object.keys(S.days).length} Tage.`}catch(e){ioMsg='Das Feld enthält keine gültige Sicherung dieser App.'}render()}
  else if(act==='ask-del'){confirmDelete=true;render()}
  else if(act==='cancel-del'){confirmDelete=false;render()}
  else if(act==='do-del'){S={settings:{...S.settings},days:{},demo:false};confirmDelete=false;save();go('home')}
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='pickdate'){if(t.value&&t.value<=todayKey()){trackDate=t.value;render()}return}
  if(t.id==='note'){const e=entry(trackDate);e.note=t.value;tidy(trackDate);save();flash()}
  if(t.id==='cl'){const v=+t.value;if(v>=15&&v<=60){S.settings.cycleLen=v;save()}}
  if(t.id==='pl'){const v=+t.value;if(v>=1&&v<=12){S.settings.periodLen=v;save()}}
  if(t.id==='cu'){S.settings.custom=t.value.split(',').map(x=>x.trim()).filter(Boolean);save()}
});
render();
</script>

<script>
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
// ask the browser to keep this app's storage (so it is not cleared under storage pressure)
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script>
</body>
